<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Обработка авторизации...</h2>
        <p>Пожалуйста, подождите</p>
    </div>

    <script>
        // Получаем данные из Django контекста
        const success = {{ success|yesno:"true,false" }};
        const code = "{{ code|default:'' }}";
        const error = "{{ error|default:'' }}";
        const redirectUrl = "{{ redirect_url|default:'' }}";
        
        if (success && code && redirectUrl) {
            // Перенаправляем на фронтенд с кодом
            window.location.href = redirectUrl + '?code=' + encodeURIComponent(code);
        } else if (error) {
            // Перенаправляем с ошибкой
            window.location.href = redirectUrl + '?error=' + encodeURIComponent(error);
        } else {
            // Неизвестная ошибка
            window.location.href = redirectUrl + '?error=Неизвестная ошибка';
        }
    </script>
</body>
</html>
